<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXY | Profile</title>
    <style>
        :root {
            --primary-color: #00d2ff;
            --glass-bg: rgba(0, 0, 0, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        /* Background Video */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- FLOATING ANIMATION --- */
        @keyframes slowFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); } /* 20px up move karega */
            100% { transform: translateY(0px); }
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
            
            /* Animation Apply Kiya Yahan */
            animation: slowFloat 6s ease-in-out infinite;
        }

        .profile-img {
            width: 110px; height: 110px; border-radius: 50%;
            border: 3px solid var(--primary-color); margin-bottom: 15px;
            box-shadow: 0 0 15px var(--primary-color); object-fit: cover;
        }

        h2.title { font-size: 1rem; color: #888; margin-bottom: 5px; letter-spacing: 2px; }
        h1.main-name { font-size: 1.5rem; margin: 0 0 20px 0; color: #fff; }

        .info-card { 
            background: rgba(255,255,255,0.03); 
            border-radius: 15px; padding: 15px; 
            text-align: left; margin-bottom: 20px; 
            border: 1px solid var(--border-color); 
        }

        .info-item { margin-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 5px; }
        .label { color: #888; font-size: 0.75rem; font-weight: bold; display: block; }
        .value { color: #00d2ff; font-size: 0.95rem; display: block; margin-top: 2px; }

        .btn-main { 
            display: block; background: var(--primary-color); 
            color: black; padding: 12px; border-radius: 12px; 
            text-decoration: none; font-weight: bold; 
            margin-bottom: 15px; transition: 0.3s; 
        }
        .btn-main:hover { transform: scale(1.05); background: #fff; }

        .nav-links { display: flex; justify-content: space-around; margin-top: 20px; }
        .nav-links a { color: #666; text-decoration: none; font-size: 0.8rem; letter-spacing: 1px; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary-color); }

        .glitch-footer { font-size: 0.8rem; color: #444; margin-top: 20px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">

            <div class="info-item">
                <span class="label">🕸️ BIRTH</span>

            </div>
            <div class="info-item" style="border:none;">

        <a href="#" class="btn-main">CONTACT PROXY</a>

            <span style="color:#666; font-size: 0.7rem;">💢 𝐋ɪᴠɪɴɢ 𝐈ɴ 𝐌ʏ 𝐎ᴡɴ 𝐆ʟɪᴛᴄʜᴇᴅ 𝐖ᴏʀʟᴅ 💢</span>

</body>
